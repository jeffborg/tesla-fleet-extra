name: Validate

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate-hacs:
    name: Validate HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
          # This fork overrides a built-in integration and is installed as a
          # custom repository, so its brand assets live in HA core, not here.
          ignore: brands

  validate-hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: hassfest validation
        # The published hassfest image always tracks HA *dev*, whose
        # tesla-fleet-api pin runs ahead of the release this fork syncs from
        # (dev pins 1.17.2; 2026.9.4 pins 1.10.0), so the requirements plugin
        # flags our release-matched pin as "incompatible". Skip just that
        # plugin — the pin itself is covered by tests/test_apply_patches.py.
        # Run the image directly because the action exposes no arguments.
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/github/workspace" \
            ghcr.io/home-assistant/hassfest --skip-plugins requirements
